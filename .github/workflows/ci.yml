name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Install the packed tarballs into the Vite example and build it: proves the published
      # package resolves and compiles outside the workspace.
      - run: pnpm pack:local
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: examples/vite-react
